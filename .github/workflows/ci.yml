name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # C TEST SUITE
  # ==========================================================================

  test:
    name: C tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            z3 \
            libz3-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Show tool versions
        run: |
          python3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"
          z3 --version
          cc --version
          make --version

      - name: Build and run C test suite
        run: |
          make test

  # ==========================================================================
  # FORMAL VERIFICATION
  # ==========================================================================

  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run formal verification
        run: |
          make formal

      - name: Verify generated SMT files
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(formal/*.smt2)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no SMT2 proof files were generated"
            exit 1
          fi

          echo "Generated SMT files:"
          printf '  %s\n' "${files[@]}"

  # ==========================================================================
  # LEGACY / GENERAL COLLISION FINDER
  # ==========================================================================

  collision-finder:
    name: Collision Finder Research
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3 installation
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Verify collision finder exists
        run: |
          test -f benchmark/collision_finder.py

      - name: Python syntax check
        run: |
          python3 -m py_compile benchmark/collision_finder.py

      - name: Run collision finder self-test
        run: |
          python3 benchmark/collision_finder.py \
            --solver z3 \
            --self-test

      - name: Run reduced-round collision search
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 4 \
            --timeout 60 \
            --dump-smt reduced_round_collision.smt2

          status=$?

          echo "Reduced-round solver exit status: ${status}"

          if [ "${status}" -eq 0 ]; then
            echo "Collision search succeeded."
          elif [ "${status}" -eq 1 ]; then
            echo "No collision under the supplied constraints."
          elif [ "${status}" -eq 2 ]; then
            echo "Solver returned unknown/timeout."
          else
            echo "Collision finder encountered an actual error."
            exit "${status}"
          fi

          exit 0

      - name: Run 39-round known construction verification
        run: |
          python3 - <<'PY'
          import sys
          from benchmark.collision_finder import verify_known_39_collision

          if not verify_known_39_collision():
              print("ERROR: known 39-round construction failed")
              sys.exit(1)

          print("Known 39-round construction verified.")
          PY

      - name: Run differential-window experiment
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 39 \
            --zero-start 12 \
            --zero-rounds 16 \
            --timeout 60 \
            --dump-smt collision_window.smt2

          status=$?

          echo "Differential-window exit status: ${status}"

          case "${status}" in
            0)
              echo "Differential-window collision found and independently verified."
              ;;
            1)
              echo "Differential-window constraints are UNSAT."
              ;;
            2)
              echo "Differential-window search timed out / returned unknown."
              echo "This is an exploratory benchmark result, not a CI failure."
              ;;
            *)
              echo "Unexpected collision finder failure."
              exit "${status}"
              ;;
          esac

          exit 0

      - name: Verify generated SMT exports
        shell: bash
        run: |
          set -euo pipefail

          if [ -s reduced_round_collision.smt2 ]; then
            echo "Reduced-round SMT export:"
            wc -c reduced_round_collision.smt2
          fi

          if [ -s collision_window.smt2 ]; then
            echo "Differential-window SMT export:"
            wc -c collision_window.smt2
          fi

      - name: Run Floyd O(1)-memory research test
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --floyd \
            --rounds 4 \
            --seed 1 \
            --max-iterations 10000 \
            --report-every 5000

          status=$?

          echo "Floyd exit status: ${status}"

          if [ "${status}" -eq 0 ]; then
            echo "Cycle detected."
          elif [ "${status}" -eq 1 ]; then
            echo "No cycle within iteration budget."
          else
            echo "Floyd finder failed."
            exit "${status}"
          fi

          exit 0

      - name: Upload collision finder artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collision-finder-research
          path: |
            reduced_round_collision.smt2
            collision_window.smt2
          if-no-files-found: warn

  # ==========================================================================
  # SHA256SW CP-SAT RESEARCH
  # ==========================================================================

  sha256sw-cpsat:
    name: SHA256SW CP-SAT Research
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install OR-Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ortools

      - name: Verify installation
        run: |
          python3 --version
          python3 -c "from ortools.sat.python import cp_model; print('OR-Tools import: OK')"

      - name: Verify SHA256SW source exists
        run: |
          test -f benchmark/sha256sw_advanced_finder_fixed.py

      - name: Python syntax check
        run: |
          python3 -m py_compile \
            benchmark/sha256sw_advanced_finder_fixed.py

      - name: Run SHA256SW self-tests
        run: |
          python3 benchmark/sha256sw_advanced_finder_fixed.py \
            --self-test

      - name: Run CP-SAT smoke test
        run: |
          set -o pipefail

          python3 benchmark/sha256sw_advanced_finder_fixed.py \
            --rounds 4 \
            --meet-k 2 \
            --timeout 5 \
            --workers 2 \
            | tee sha256sw_smoke.txt

      - name: Run meeting-point sweep
        run: |
          set -o pipefail

          python3 benchmark/sha256sw_advanced_finder_fixed.py \
            --rounds 6 \
            --sweep 1,2,3,4,5 \
            --timeout 5 \
            --workers 2 \
            | tee sha256sw_sweep.txt

      - name: Collect research metadata
        run: |
          {
            echo "SHA256SW CP-SAT Research Run"
            echo "================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Runner:     $RUNNER_OS"
            echo
            echo "Python:"
            python3 --version
            echo
            echo "OR-Tools:"
            python3 -c "import ortools; print(ortools.__version__)"
            echo
            echo "CPU:"
            nproc
            echo
            echo "Timestamp:"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          } | tee sha256sw_environment.txt

      - name: Build research summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# SHA256SW CP-SAT Research"
            echo
            echo "## Run"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Python: \`$(python3 --version)\`"
            echo "- OR-Tools: \`$(python3 -c 'import ortools; print(ortools.__version__)')\`"
            echo "- CPU cores: \`$(nproc)\`"
            echo
            echo "## Meeting-point sweep"
            echo
            echo '```text'
            cat sha256sw_sweep.txt
            echo '```'
            echo
            echo "## CP-SAT smoke test"
            echo
            echo '```text'
            cat sha256sw_smoke.txt
            echo '```'
          } > sha256sw_summary.md

          cat sha256sw_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SHA256SW research results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-cpsat-${{ github.run_number }}
          path: |
            sha256sw_summary.md
            sha256sw_environment.txt
            sha256sw_smoke.txt
            sha256sw_sweep.txt
          if-no-files-found: warn

  # ==========================================================================
  # SYMBOLIC EQUIVALENCE BENCHMARK
  # ==========================================================================

  benchmark-equivalence:
    name: Symbolic equivalence benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run Python syntax check
        run: |
          python3 -m py_compile \
            benchmark/sha256_representation_benchmark.py

      - name: Run equivalence benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode equiv \
            --equiv-rounds 2 4 8 16 \
            --trials 1 \
            --equiv-timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload equivalence results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-equivalence-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn

  # ==========================================================================
  # REDUCED-ROUND COLLISION BENCHMARK
  # ==========================================================================

  benchmark-collision:
    name: Reduced-round Collision Benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run reduced-round collision benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode collision \
            --rounds 16 20 \
            --trials 1 \
            --timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-benchmark-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn
