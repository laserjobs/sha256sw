name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # C TESTS
  # ============================================================
  test:
    name: C tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            z3 \
            libz3-dev

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Show tool versions
        run: |
          python3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"
          cc --version
          z3 --version
          make --version

      - name: Build and run C test suite
        run: make test

  # ============================================================
  # FORMAL VERIFICATION
  # ============================================================
  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run formal verification
        run: make formal

      - name: Verify generated SMT files
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(formal/*.smt2)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no SMT2 proof files were generated"
            exit 1
          fi

          echo "Generated SMT files:"
          printf '  %s\n' "${files[@]}"

      - name: Upload SMT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-smt-files
          path: formal/*.smt2
          if-no-files-found: warn

  # ============================================================
  # COLLISION FINDER
  # ============================================================
  collision-finder:
    name: Collision Finder
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Verify collision finder exists
        run: |
          test -f benchmark/collision_finder.py
          echo "Found benchmark/collision_finder.py"

      - name: Python syntax check
        run: |
          python3 -m py_compile benchmark/collision_finder.py

      # Known-solvable reduced-round test.
      - name: Run 4-round collision search
        run: |
          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 4 \
            --timeout 60

      # Experimental search.
      # Exit code 2 is treated as a solver timeout.
      - name: Run 8-round collision search
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 8 \
            --timeout 60

          status=$?

          echo "8-round collision finder exit code: ${status}"

          if [ "${status}" -ne 0 ] && [ "${status}" -ne 2 ]; then
            echo "Collision finder failed with unexpected exit code."
            exit "${status}"
          fi

      - name: Run 9-round collision search
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 9 \
            --timeout 60

          status=$?

          echo "9-round collision finder exit code: ${status}"

          if [ "${status}" -ne 0 ] && [ "${status}" -ne 2 ]; then
            echo "Collision finder failed with unexpected exit code."
            exit "${status}"
          fi

      - name: Collect collision finder results
        if: always()
        shell: bash
        run: |
          mkdir -p collision-results

          cp benchmark/collision_finder.py collision-results/

          find . -maxdepth 3 -type f \
            \( -name "*.smt2" -o -name "*collision*" -o -name "*.json" \) \
            -print \
            > collision-results/files.txt || true

      - name: Upload collision finder results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-finder-results
          path: collision-results/
          if-no-files-found: warn

  # ============================================================
  # SYMBOLIC EQUIVALENCE BENCHMARK
  # ============================================================
  benchmark-equivalence:
    name: Symbolic equivalence benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Check benchmark exists
        run: |
          test -f benchmark/sha256_representation_benchmark.py

      - name: Run Python syntax check
        run: |
          python3 -m py_compile \
            benchmark/sha256_representation_benchmark.py

      - name: Run equivalence benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode equiv \
            --equiv-rounds 2 4 8 16 \
            --trials 1 \
            --equiv-timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload equivalence results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256sw-equivalence-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn

  # ============================================================
  # REDUCED-ROUND COLLISION BENCHMARK
  # ============================================================
  benchmark-collision:
    name: Reduced-round collision benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Check benchmark exists
        run: |
          test -f benchmark/sha256_representation_benchmark.py

      - name: Run reduced-round collision benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode collision \
            --rounds 16 20 \
            --trials 1 \
            --timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload collision benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256sw-benchmark-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn

  # ============================================================
  # FINAL CI STATUS
  # ============================================================
  ci-success:
    name: CI complete
    runs-on: ubuntu-latest
    needs:
      - test
      - formal
      - collision-finder
      - benchmark-equivalence
      - benchmark-collision

    steps:
      - name: All CI jobs passed
        run: |
          echo "========================================"
          echo "SHA256SW CI COMPLETE"
          echo "========================================"
          echo
          echo "C tests:                    PASS"
          echo "Formal verification:        PASS"
          echo "Collision finder:           PASS"
          echo "Equivalence benchmark:      PASS"
          echo "Collision benchmark:        PASS"
          echo
          echo "All required CI jobs completed."
