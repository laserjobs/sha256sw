name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: C tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            z3 \
            python3-z3 \
            libz3-dev

      - name: Show tool versions
        run: |
          python3 --version
          cc --version
          z3 --version
          make --version

      - name: Build and run C test suite
        run: make test

  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            z3 \
            python3-z3

      - name: Run formal verification
        run: make formal

      - name: Verify generated SMT files
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(formal/*.smt2)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no SMT2 proof files were generated"
            exit 1
          fi

          echo "Generated SMT files:"
          printf '  %s\n' "${files[@]}"

  benchmark-equivalence:
    name: Symbolic equivalence benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            z3 \
            python3-z3

      - name: Run Python syntax checks
        run: |
          python3 -m py_compile \
            collision_finder.py \
            benchmark/sha256_representation_benchmark.py

      - name: Run collision finder self-test
        run: |
          python3 collision_finder.py --self-test

      - name: Run equivalence benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode equiv \
            --equiv-rounds 2 4 8 16 \
            --trials 1 \
            --equiv-timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

  benchmark-collision:
    name: Reduced-round collision benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            z3 \
            python3-z3

      - name: Run existing collision benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode collision \
            --rounds 16 20 \
            --trials 1 \
            --timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha256sw-benchmark-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn

  collision-finder:
    name: Collision finder
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            z3 \
            python3-z3

      - name: Check Z3
        run: |
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"
          z3 --version

      - name: Check collision finder syntax
        run: |
          python3 -m py_compile collision_finder.py

      - name: Run implementation self-test
        run: |
          python3 collision_finder.py --self-test

      - name: Find deterministic 4-round collision
        run: |
          python3 collision_finder.py \
            --rounds 4 \
            --timeout 60 \
            --seed 1 \
            --dump-smt collision_r4.smt2

      - name: Verify SMT export exists
        run: |
          test -s collision_r4.smt2

      - name: Upload collision SMT problem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-finder-smt
          path: collision_r4.smt2
          if-no-files-found: warn
