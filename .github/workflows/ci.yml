name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================================
  # C TEST SUITE
  # ==========================================================================

  test:
    name: C tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            z3 \
            libz3-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Show tool versions
        run: |
          python3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"
          z3 --version
          cc --version
          make --version

      - name: Build and run C test suite
        run: |
          make test


  # ==========================================================================
  # FORMAL VERIFICATION
  # ==========================================================================

  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run formal verification
        run: |
          make formal

      - name: Verify generated SMT files
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(formal/*.smt2)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no SMT2 proof files were generated"
            exit 1
          fi

          echo "Generated SMT files:"
          printf '  %s\n' "${files[@]}"


  # ==========================================================================
  # LEGACY / GENERAL COLLISION FINDER
  # ==========================================================================

  collision-finder:
    name: Collision Finder Research
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3 installation
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Verify collision finder exists
        run: |
          test -f benchmark/collision_finder.py

      - name: Python syntax check
        run: |
          python3 -m py_compile benchmark/collision_finder.py

      - name: Run collision finder self-test
        run: |
          python3 benchmark/collision_finder.py \
            --solver z3 \
            --self-test

      - name: Run reduced-round collision search
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 4 \
            --timeout 60 \
            --dump-smt reduced_round_collision.smt2

          status=$?

          echo "Reduced-round solver exit status: ${status}"

          case "${status}" in
            0)
              echo "Collision search succeeded."
              ;;
            1)
              echo "No collision under the supplied constraints."
              ;;
            2)
              echo "Solver returned unknown/timeout."
              ;;
            *)
              echo "Collision finder encountered an actual error."
              exit "${status}"
              ;;
          esac

          exit 0

      - name: Run 39-round known construction verification
        run: |
          python3 - <<'PY'
          import sys
          from benchmark.collision_finder import verify_known_39_collision

          if not verify_known_39_collision():
              print("ERROR: known 39-round construction failed")
              sys.exit(1)

          print("Known 39-round construction verified.")
          PY

      - name: Run differential-window experiment
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --solver z3 \
            --rounds 39 \
            --zero-start 12 \
            --zero-rounds 16 \
            --timeout 60 \
            --dump-smt collision_window.smt2

          status=$?

          echo "Differential-window exit status: ${status}"

          case "${status}" in
            0)
              echo "Differential-window collision found and independently verified."
              ;;
            1)
              echo "Differential-window constraints are UNSAT."
              ;;
            2)
              echo "Differential-window search timed out / returned unknown."
              echo "This is an exploratory benchmark result, not a CI failure."
              ;;
            *)
              echo "Unexpected collision finder failure."
              exit "${status}"
              ;;
          esac

          exit 0

      - name: Verify generated SMT exports
        shell: bash
        run: |
          set -euo pipefail

          if [ -s reduced_round_collision.smt2 ]; then
            echo "Reduced-round SMT export:"
            wc -c reduced_round_collision.smt2
          fi

          if [ -s collision_window.smt2 ]; then
            echo "Differential-window SMT export:"
            wc -c collision_window.smt2
          fi

      - name: Run Floyd O(1)-memory research test
        shell: bash
        run: |
          set +e

          python3 benchmark/collision_finder.py \
            --floyd \
            --rounds 4 \
            --seed 1 \
            --max-iterations 10000 \
            --report-every 5000

          status=$?

          echo "Floyd exit status: ${status}"

          case "${status}" in
            0)
              echo "Cycle detected."
              ;;
            1)
              echo "No cycle within iteration budget."
              ;;
            *)
              echo "Floyd finder failed."
              exit "${status}"
              ;;
          esac

          exit 0

      - name: Upload collision finder artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collision-finder-research
          path: |
            reduced_round_collision.smt2
            collision_window.smt2
          if-no-files-found: warn


  # ==========================================================================
  # SHA256SW CP-SAT RESEARCH
  # ==========================================================================

  sha256sw-cpsat:
    name: SHA256SW CP-SAT Research
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install OR-Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ortools

      - name: Verify OR-Tools
        run: |
          python3 --version
          python3 -c "from ortools.sat.python import cp_model; print('OR-Tools import: OK')"
          python3 -c "import ortools; print('OR-Tools:', ortools.__version__)"

      - name: Verify SHA256SW source exists
        run: |
          test -f benchmark/sha256sw_advanced_finder_fixed.py

      - name: Python syntax check
        run: |
          python3 -m py_compile \
            benchmark/sha256sw_advanced_finder_fixed.py

      # ----------------------------------------------------------------------
      # SELF TESTS
      # ----------------------------------------------------------------------

      - name: Run SHA256SW self-tests
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "SHA256SW SELF-TEST"
          echo "============================================================"

          python3 -u benchmark/sha256sw_advanced_finder_fixed.py \
            --self-test \
            2>&1 | tee sha256sw_selftest.txt

          status=${PIPESTATUS[0]}

          echo
          echo "SHA256SW self-test exit status: ${status}"

          exit "${status}"

      # ----------------------------------------------------------------------
      # CP-SAT SMOKE TEST
      # ----------------------------------------------------------------------

      - name: Run CP-SAT smoke test
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "SHA256SW CP-SAT SMOKE TEST"
          echo "============================================================"

          python3 -u benchmark/sha256sw_advanced_finder_fixed.py \
            --rounds 4 \
            --meet-k 2 \
            --timeout 5 \
            --workers 2 \
            2>&1 | tee sha256sw_smoke.txt

          status=${PIPESTATUS[0]}

          echo
          echo "CP-SAT smoke-test exit status: ${status}"

          exit "${status}"

      # ----------------------------------------------------------------------
      # MEETING-POINT SWEEP
      # ----------------------------------------------------------------------

      - name: Run SHA256SW meeting-point sweep
        shell: bash
        run: |
          set -o pipefail

          echo
          echo "============================================================"
          echo "SHA256SW CP-SAT MEETING-POINT SWEEP"
          echo "============================================================"
          echo
          echo "Starting sweep..."
          echo

          python3 -u benchmark/sha256sw_advanced_finder_fixed.py \
            --rounds 6 \
            --sweep 1,2,3,4,5 \
            --timeout 5 \
            --workers 2 \
            2>&1 | tee sha256sw_sweep.txt

          status=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "SHA256SW SWEEP COMPLETE"
          echo "============================================================"
          echo "Python exit status: ${status}"
          echo

          if [ ! -s sha256sw_sweep.txt ]; then
            echo "ERROR: SHA256SW produced no captured output."
            echo
            echo "The program completed without writing anything to stdout/stderr."
            echo "This is considered a CI failure because no research result"
            echo "was reported."
            exit 1
          fi

          echo "Captured SHA256SW output:"
          echo "------------------------------------------------------------"
          cat sha256sw_sweep.txt
          echo "------------------------------------------------------------"

          exit "${status}"

      # ----------------------------------------------------------------------
      # PUBLISH RESULTS TO GITHUB SUMMARY
      # ----------------------------------------------------------------------

      - name: Publish SHA256SW research results
        if: always()
        shell: bash
        run: |
          {
            echo "# SHA256SW CP-SAT Research"
            echo
            echo "## Meeting-point sweep"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "**Python:** \`$(python3 --version)\`"
            echo
            echo "**OR-Tools:** \`$(python3 -c 'import ortools; print(ortools.__version__)')\`"
            echo
            echo "**CPU cores:** \`$(nproc)\`"
            echo
            echo "### Sweep output"
            echo
            echo '```text'

            if [ -s sha256sw_sweep.txt ]; then
              cat sha256sw_sweep.txt
            else
              echo "ERROR: No SHA256SW sweep output was captured."
            fi

            echo '```'
            echo
            echo "### Smoke-test output"
            echo
            echo '```text'

            if [ -s sha256sw_smoke.txt ]; then
              cat sha256sw_smoke.txt
            else
              echo "No smoke-test output captured."
            fi

            echo '```'
            echo
            echo "### Self-test output"
            echo
            echo '```text'

            if [ -s sha256sw_selftest.txt ]; then
              cat sha256sw_selftest.txt
            else
              echo "No self-test output captured."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # PRINT RESULTS AGAIN IN ACTION LOG
      # ----------------------------------------------------------------------

      - name: Print SHA256SW results
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "SHA256SW SELF-TEST OUTPUT"
          echo "============================================================"
          cat sha256sw_selftest.txt 2>/dev/null || true

          echo
          echo "============================================================"
          echo "SHA256SW CP-SAT SMOKE TEST OUTPUT"
          echo "============================================================"
          cat sha256sw_smoke.txt 2>/dev/null || true

          echo
          echo "============================================================"
          echo "SHA256SW CP-SAT SWEEP OUTPUT"
          echo "============================================================"
          cat sha256sw_sweep.txt 2>/dev/null || true

      # ----------------------------------------------------------------------
      # ENVIRONMENT INFORMATION
      # ----------------------------------------------------------------------

      - name: Collect SHA256SW research metadata
        if: always()
        shell: bash
        run: |
          {
            echo "SHA256SW CP-SAT Research Run"
            echo "================================"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit:     $GITHUB_SHA"
            echo "Branch:     $GITHUB_REF_NAME"
            echo "Runner:     $RUNNER_OS"
            echo
            echo "Python:"
            python3 --version
            echo
            echo "OR-Tools:"
            python3 -c "import ortools; print(ortools.__version__)"
            echo
            echo "CPU:"
            nproc
            echo
            echo "Timestamp:"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
          } | tee sha256sw_environment.txt

      # ----------------------------------------------------------------------
      # UPLOAD RESULTS
      # ----------------------------------------------------------------------

      - name: Upload SHA256SW research results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-cpsat-${{ github.run_number }}
          path: |
            sha256sw_selftest.txt
            sha256sw_smoke.txt
            sha256sw_sweep.txt
            sha256sw_environment.txt
          if-no-files-found: warn


  # ==========================================================================
  # SYMBOLIC EQUIVALENCE BENCHMARK
  # ==========================================================================

  benchmark-equivalence:
    name: Symbolic equivalence benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run Python syntax check
        run: |
          python3 -m py_compile \
            benchmark/sha256_representation_benchmark.py

      - name: Run equivalence benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode equiv \
            --equiv-rounds 2 4 8 16 \
            --trials 1 \
            --equiv-timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload equivalence results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-equivalence-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn


  # ==========================================================================
  # REDUCED-ROUND COLLISION BENCHMARK
  # ==========================================================================

  benchmark-collision:
    name: Reduced-round Collision Benchmark
    runs-on: ubuntu-latest
    needs: formal
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver

      - name: Verify Z3
        run: |
          z3 --version
          python3 -c "import z3; print('Z3 Python:', z3.get_version_string())"

      - name: Run reduced-round collision benchmark
        run: |
          python3 benchmark/sha256_representation_benchmark.py \
            z3 \
            --mode collision \
            --rounds 16 20 \
            --trials 1 \
            --timeout 30

      - name: Check benchmark exports
        run: |
          test -s sha256sw_benchmark.json
          test -s sha256sw_benchmark.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sha256sw-benchmark-results
          path: |
            sha256sw_benchmark.json
            sha256sw_benchmark.csv
          if-no-files-found: warn
